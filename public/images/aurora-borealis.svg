<svg xmlns="http://www.w3.org/2000/svg" width="3000" height="4500" viewBox="0 0 400 600">
  <defs>
    <linearGradient id="aurora1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff80" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#8800ff" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="aurora2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00ccff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00ff80" stop-opacity="0.3"/>
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="#060918"/>
  <!-- Aurora ribbons -->
  <path d="M0 200 Q100 120 200 180 Q300 240 400 150" stroke="url(#aurora1)" stroke-width="40" fill="none" opacity="0.6"/>
  <path d="M0 250 Q100 170 200 230 Q300 290 400 200" stroke="url(#aurora2)" stroke-width="25" fill="none" opacity="0.5"/>
  <path d="M0 180 Q150 100 300 160 Q350 180 400 130" stroke="#00ff88" stroke-width="15" fill="none" opacity="0.4"/>
  <!-- Stars -->
  <circle cx="50" cy="50" r="1" fill="white" opacity="0.9"/>
  <circle cx="150" cy="30" r="1.5" fill="white" opacity="0.8"/>
  <circle cx="300" cy="60" r="1" fill="white" opacity="0.9"/>
  <circle cx="80" cy="90" r="1" fill="white" opacity="0.7"/>
  <circle cx="220" cy="80" r="1.5" fill="white" opacity="0.9"/>
  <circle cx="370" cy="40" r="1" fill="white" opacity="0.8"/>
  <!-- Frozen lake reflection -->
  <rect x="0" y="430" width="400" height="170" fill="#0a1230" opacity="0.9"/>
  <path d="M0 390 Q200 430 400 400" fill="#0a1230"/>
  <!-- Aurora reflection in lake -->
  <path d="M0 460 Q100 440 200 455 Q300 470 400 450" stroke="#00ff80" stroke-width="20" fill="none" opacity="0.2"/>
  <!-- Ice details -->
  <line x1="50" y1="440" x2="100" y2="500" stroke="#c8d8f0" stroke-width="0.5" opacity="0.3"/>
  <line x1="200" y1="450" x2="260" y2="520" stroke="#c8d8f0" stroke-width="0.5" opacity="0.3"/>
  <line x1="320" y1="445" x2="350" y2="490" stroke="#c8d8f0" stroke-width="0.5" opacity="0.3"/>
</svg>
