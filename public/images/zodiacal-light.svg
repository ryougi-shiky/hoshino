<svg xmlns="http://www.w3.org/2000/svg" width="3000" height="4000" viewBox="0 0 300 400">
  <defs>
    <linearGradient id="sky2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0a0810"/>
      <stop offset="100%" stop-color="#060918"/>
    </linearGradient>
    <radialGradient id="zodiac" cx="50%" cy="90%" r="60%">
      <stop offset="0%" stop-color="#f0d68c" stop-opacity="0.3"/>
      <stop offset="40%" stop-color="#c8d8f0" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#060918" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="300" height="400" fill="url(#sky2)"/>
  <!-- Zodiacal light cone -->
  <polygon points="150,400 130,200 170,200" fill="url(#zodiac)"/>
  <polygon points="150,400 110,150 190,150" fill="#c8d8f0" opacity="0.05"/>
  <!-- Stars -->
  <circle cx="60" cy="50" r="1" fill="white" opacity="0.9"/>
  <circle cx="130" cy="30" r="1.5" fill="white" opacity="0.8"/>
  <circle cx="240" cy="60" r="1" fill="white" opacity="0.9"/>
  <circle cx="40" cy="120" r="1" fill="white" opacity="0.7"/>
  <circle cx="200" cy="100" r="1.5" fill="white" opacity="0.8"/>
  <circle cx="270" cy="150" r="1" fill="white" opacity="0.7"/>
  <circle cx="80" cy="190" r="1" fill="white" opacity="0.6"/>
  <circle cx="230" cy="200" r="1" fill="white" opacity="0.7"/>
  <!-- Desert horizon -->
  <path d="M0,400 L0,350 Q75,320 150,340 Q225,360 300,335 L300,400 Z" fill="#080608"/>
</svg>
