<svg xmlns="http://www.w3.org/2000/svg" width="3000" height="2000" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="#060918"/>
  <!-- Milky Way background -->
  <ellipse cx="300" cy="180" rx="280" ry="70" fill="#2a1a6a" opacity="0.4"/>
  <!-- Meteor streak -->
  <line x1="450" y1="50" x2="200" y2="200" stroke="white" stroke-width="2" opacity="0.9"/>
  <line x1="450" y1="50" x2="200" y2="200" stroke="#f0d68c" stroke-width="1" opacity="0.6"/>
  <!-- Meteor head glow -->
  <circle cx="450" cy="50" r="3" fill="white" opacity="1"/>
  <circle cx="450" cy="50" r="8" fill="#f0d68c" opacity="0.4"/>
  <!-- Stars - constellation dots -->
  <circle cx="100" cy="100" r="2" fill="white" opacity="0.9"/>
  <circle cx="140" cy="80" r="1.5" fill="white" opacity="0.8"/>
  <circle cx="180" cy="90" r="2" fill="white" opacity="0.9"/>
  <circle cx="220" cy="70" r="1" fill="white" opacity="0.7"/>
  <circle cx="300" cy="60" r="1.5" fill="white" opacity="0.8"/>
  <circle cx="400" cy="80" r="1" fill="white" opacity="0.7"/>
  <circle cx="500" cy="100" r="2" fill="white" opacity="0.9"/>
  <circle cx="540" cy="150" r="1" fill="white" opacity="0.7"/>
  <circle cx="60" cy="180" r="1.5" fill="white" opacity="0.8"/>
  <circle cx="80" cy="250" r="1" fill="white" opacity="0.7"/>
  <circle cx="550" cy="220" r="1.5" fill="white" opacity="0.8"/>
  <!-- Canyon silhouette -->
  <path d="M0,400 L0,320 Q50,280 100,310 L130,280 L160,310 Q200,260 250,290 L300,240 L350,270 Q400,230 450,260 L480,240 L510,260 Q550,230 600,260 L600,400 Z" fill="#0a0604"/>
</svg>
