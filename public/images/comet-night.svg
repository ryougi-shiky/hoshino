<svg xmlns="http://www.w3.org/2000/svg" width="4000" height="5000" viewBox="0 0 400 500">
  <defs>
    <linearGradient id="twi" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#a0340a"/>
      <stop offset="20%" stop-color="#5a1a40"/>
      <stop offset="50%" stop-color="#1a0a35"/>
      <stop offset="100%" stop-color="#060918"/>
    </linearGradient>
  </defs>
  <rect width="400" height="500" fill="url(#twi)"/>
  <!-- Comet head -->
  <circle cx="200" cy="180" r="5" fill="white" opacity="0.95"/>
  <circle cx="200" cy="180" r="10" fill="#c8d8f0" opacity="0.5"/>
  <!-- Comet tail -->
  <path d="M200,180 Q240,210 300,280" stroke="#c8d8f0" stroke-width="8" fill="none" opacity="0.3" stroke-linecap="round"/>
  <path d="M200,180 Q230,215 280,300" stroke="white" stroke-width="3" fill="none" opacity="0.5" stroke-linecap="round"/>
  <path d="M200,180 Q245,205 310,260" stroke="#c8d8f0" stroke-width="4" fill="none" opacity="0.2" stroke-linecap="round"/>
  <!-- Stars -->
  <circle cx="80" cy="60" r="1.5" fill="white" opacity="0.9"/>
  <circle cx="180" cy="40" r="1" fill="white" opacity="0.8"/>
  <circle cx="320" cy="70" r="1" fill="white" opacity="0.7"/>
  <circle cx="50" cy="130" r="1" fill="white" opacity="0.8"/>
  <circle cx="340" cy="140" r="1.5" fill="white" opacity="0.9"/>
  <circle cx="100" cy="220" r="1" fill="white" opacity="0.7"/>
  <!-- Desert silhouette -->
  <path d="M0,500 L0,380 Q100,340 200,360 Q300,380 400,350 L400,500 Z" fill="#1a0800"/>
</svg>
